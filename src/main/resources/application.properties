spring.application.name=Smart Package Management System Back-End

spring.datasource.url=jdbc:mysql://wyt1t6.h.filess.io:61002/spms_toneckdear
spring.datasource.username=spms_toneckdear
spring.datasource.password=24c7844284d00a0e65b4d29c96336250a98084a9
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate 7 requires either an explicit dialect or a live JDBC connection
# at boot to autodetect; without this line you get
# "Unable to determine Dialect without JDBC metadata".
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- US-03: Notification & Mail configuration ---
# Dev default: do not actually send mail; ConsoleMailService just logs the
# would-be email so we can develop without an SMTP server. Flip this to true
# in prod (along with spring.mail.* properties) to use SmtpMailService.
spms.mail.enabled=false
spms.mail.from=noreply@sioux.local
spms.company.name=Sioux

# Optional fallback recipient list (comma-separated) used when the
# receptionist did not pick specific managers and there are no MANAGER
# users in the database yet. Useful during early demos.
spms.mail.fallback-recipients=

# Spring mail defaults so JavaMailSender autoconfiguration is happy even
# when we are not actually sending. Override these in prod via env vars.
spring.mail.host=${SPMS_MAIL_HOST:localhost}
spring.mail.port=${SPMS_MAIL_PORT:25}
spring.mail.username=${SPMS_MAIL_USER:}
spring.mail.password=${SPMS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPMS_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPMS_MAIL_STARTTLS:false}
